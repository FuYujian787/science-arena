name: Build desktop releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
        env:
          ARENA_IGNORE_ENV_FILE: '1'
          LLM_PROVIDER: mock
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run pack:win
            label: Windows-x64
          - os: macos-15-intel
            command: npm run pack:mac -- --x64
            label: macOS-x64
          - os: macos-latest
            command: npm run pack:mac -- --arm64
            label: macOS-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.blockmap
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving its reviewed assets."
            exit 0
          fi
          gh release create "$TAG" --draft --title "Science Arena $TAG" --notes "Windows/macOS builds. Unsigned; see distribution documentation for verification status."
          find artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.blockmap' \) -exec gh release upload "$TAG" {} \;
